# DS3218SSG Pro Servo Parameters
# Calibrated: 2026-02-01
# Pulse width per degree: 7.41 µs/° (270° range = 2000µs travel)

# Inversions handled by calibration tool - all set to false
invert_direction:
- false  # 0: FL Hip
- false  # 1: FL Femur
- false  # 2: FL Tibia
- false  # 3: FR Hip
- false  # 4: FR Femur
- false  # 5: FR Tibia
- false  # 6: BL Hip
- false  # 7: BL Femur
- false  # 8: BL Tibia
- false  # 9: BR Hip
- false  # 10: BR Femur
- false  # 11: BR Tibia

map_joint_index_to_driver_pin:
- 4   # Joint 0: FL Hip -> PIN4
- 3   # Joint 1: FL Femur -> PIN3
- 1   # Joint 2: FL Tibia -> PIN1
- 5   # Joint 3: FR Hip -> PIN5
- 2   # Joint 4: FR Femur -> PIN2
- 0   # Joint 5: FR Tibia -> PIN0
- 10  # Joint 6: BL Hip -> PIN10
- 7   # Joint 7: BL Femur -> PIN7
- 9   # Joint 8: BL Tibia -> PIN9
- 11  # Joint 9: BR Hip -> PIN11
- 6   # Joint 10: BR Femur -> PIN6
- 8   # Joint 11: BR Tibia -> PIN8

# Angle limits from calibration
