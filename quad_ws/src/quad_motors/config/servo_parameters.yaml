- -45  # 6: BL Hip
- -45  # 7: BL Femur
- -50  # 8: BL Tibia
- -45  # 9: BR Hip
- -45  # 10: BR Femur
- -50  # 11: BR Tibia

max_degrees:
- 45  # 0: FL Hip
- 45  # 1: FL Femur
- 45  # 2: FL Tibia (was 0 - prevented movement on ground; expand so tibia can track gait)
- 45  # 3: FR Hip
- 45  # 4: FR Femur
- 45  # 5: FR Tibia
- 45  # 6: BL Hip
- 45  # 7: BL Femur
- 45  # 8: BL Tibia
- 45  # 9: BR Hip
- 45  # 10: BR Femur
- 45  # 11: BR Tibia

pulse_width_per_degree:
